<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Armonizador Vocal v4 (Presets Rápidos)</title>
  <style>
    body { font-family: sans-serif; text-align: center; padding: 15px; background: #fafafa; }
    h2 { margin-bottom: 8px; }
    .small { font-size: .9em; color: #555; margin-top: 0; }
    button {
      font-size: 1.05em; padding: 10px 16px; margin: 6px;
      border-radius: 8px; border: 1px solid #ddd; background: #fff; cursor: pointer;
    }
    button:hover { background: #f4f4f4; }
    button:disabled { opacity: .5; cursor: not-allowed; }
    select, input[type=range] { font-size: 1em; padding: 6px; margin: 6px; }
    .control-group {
      margin: 10px auto; max-width: 760px; display: flex; align-items: center; justify-content: center; flex-wrap: wrap;
      gap: 6px;
    }
    label { width: 165px; text-align: right; margin-right: 8px; }
    .value-tag { min-width: 86px; display: inline-block; text-align: left; color: #333; font-weight: 600; }
    .card {
      background: #fff; border: 1px solid #e9e9e9; border-radius: 12px;
      padding: 12px; margin: 10px auto; max-width: 820px; box-shadow: 0 2px 10px rgba(0,0,0,.03);
    }
    #status { font-size: 1.05em; margin: 10px; color: #2c3e50; }
    #ratioDisplay { font-size: .9em; color: #8e44ad; min-height: 20px; }
    #errorMsg { color: #c0392b; min-height: 22px; font-weight: 600; }
    .preset-row { display: flex; justify-content: center; flex-wrap: wrap; gap: 6px; }
    .preset-btn.active { background: #e8f4ff; border-color: #8ec5ff; }
    .danger { background: #e74c3c; color: #fff; border-color: #cf3b30; }
    .danger:hover { background: #d94337; }
    .section-title { font-size: .95em; text-transform: uppercase; letter-spacing: .5px; color: #666; margin: 4px 0 8px; }
  </style>
</head>
<body>
  <h2>🎵 Armonizador Vocal v4</h2>
  <p class="small">Con presets rápidos para voces masculinas (copiar/pegar y usar).</p>

  <div class="card">
    <div class="section-title">Presets rápidos</div>
    <div class="preset-row">
      <button class="preset-btn" data-preset="suave">Masculina Suave</button>
      <button class="preset-btn" data-preset="pop">Masculina Pop</button>
      <button class="preset-btn" data-preset="grave">Masculina Grave</button>
      <button class="preset-btn" data-preset="dueto">Dúo Marcado</button>
    </div>
  </div>

  <div class="card">
    <div class="control-group">
      <label for="modeSelect">Modo:</label>
      <select id="modeSelect">
        <option value="dual" selected>Doble armonía (recomendado)</option>
        <option value="single">Armonía simple</option>
      </select>
    </div>

    <div class="control-group" id="singleIntervalGroup" style="display:none;">
      <label for="intervalSelect">Intervalo simple:</label>
      <select id="intervalSelect">
        <option value="1.1892" selected>Tercera menor (+3 st)</option>
        <option value="1.2599">Tercera mayor (+4 st)</option>
        <option value="1.3348">Cuarta justa (+5 st)</option>
        <option value="1.4983">Quinta justa (+7 st)</option>
        <option value="0.8409">Tercera menor desc. (-3 st)</option>
        <option value="0.7937">Tercera mayor desc. (-4 st)</option>
        <option value="0.7492">Cuarta justa desc. (-5 st)</option>
      </select>
    </div>

    <div class="control-group">
      <label>Vol. Original:</label>
      <input type="range" id="volOriginal" min="0" max="200" value="100" step="1" />
      <span id="volOrigLabel" class="value-tag">100%</span>
    </div>

    <div class="control-group">
      <label>Vol. Armonía +:</label>
      <input type="range" id="volUpper" min="0" max="150" value="55" step="1" />
      <span id="volUpperLabel" class="value-tag">55%</span>
    </div>

    <div class="control-group">
      <label>Vol. Armonía -:</label>
      <input type="range" id="volLower" min="0" max="150" value="50" step="1" />
      <span id="volLowerLabel" class="value-tag">50%</span>
    </div>

    <div class="control-group">
      <label>Brillo armonías:</label>
      <input type="range" id="toneCutoff" min="2200" max="8000" value="3800" step="100" />
      <span id="toneCutoffLabel" class="value-tag">3800 Hz</span>
    </div>

    <div class="control-group">
      <label>Humanizar (ms):</label>
      <input type="range" id="humanizeMs" min="0" max="40" value="18" step="1" />
      <span id="humanizeMsLabel" class="value-tag">18 ms</span>
    </div>

    <div class="control-group">
      <label>Profundidad coro:</label>
      <input type="range" id="chorusDepth" min="0" max="100" value="35" step="1" />
      <span id="chorusDepthLabel" class="value-tag">35%</span>
    </div>
  </div>

  <div class="card">
    <button id="recordBtn">🎤 Grabar</button>
    <button id="stopRecordBtn" disabled>⏹ Detener grabación</button>
    <button id="playBtn" disabled>🔊 Reproducir mezcla</button>
    <button id="playHarmonyOnlyBtn" disabled>🎵 Solo armonías</button>
    <button id="stopAllBtn" class="danger">⏹ STOP TODO</button>

    <div id="status">Listo para grabar</div>
    <div id="ratioDisplay"></div>
    <div id="errorMsg"></div>
  </div>

  <!-- ==================== SOUNDTOUCH INCORPORADO (SIN EXPORT) ==================== -->

  <!-- ==================== LÓGICA DE LA APP v4 ==================== -->
  <script>
    // UI
    const recordBtn = document.getElementById('recordBtn');
    const stopRecordBtn = document.getElementById('stopRecordBtn');
    const playBtn = document.getElementById('playBtn');
    const playHarmonyOnlyBtn = document.getElementById('playHarmonyOnlyBtn');
    const stopAllBtn = document.getElementById('stopAllBtn');

    const modeSelect = document.getElementById('modeSelect');

    const singleIntervalGroup = document.getElementById('singleIntervalGroup');

    const statusDiv = document.getElementById('status');

    const presetButtons = Array.from(document.querySelectorAll('.preset-btn'));

    // Estado
    let mediaRecorder = null;
    let audioChunks = [];
    let audioContext = null;
    let originalBuffer = null;
    let activeSources = [];

    // Presets rápidos
    const PRESETS = {

        toneCutoff: 3300,

      dueto: {
        mode: 'dual',
        volOriginal: 100,
        volUpper: 68,
        volLower: 64,
        toneCutoff: 4200,
        humanizeMs: 24,
        chorusDepth: 50,
        singleRatio: '1.1892'
      }
    };

    function setActivePresetButton(key) {
      presetButtons.forEach(btn => btn.classList.remove('active'));
      const found = presetButtons.find(b => b.dataset.preset === key);
      if (found) found.classList.add('active');
    }

    function applyPreset(key) {
      const p = PRESETS[key];
      if (!p) return;

      modeSelect.value = p.mode;
      intervalSelect.value = p.singleRatio;
      volOriginal.value = p.volOriginal;
      volUpper.value = p.volUpper;
      volLower.value = p.volLower;
      toneCutoff.value = p.toneCutoff;
      humanizeMs.value = p.humanizeMs;
      chorusDepth.value = p.chorusDepth;

      updateModeUI();
      updateLabels();
      setActivePresetButton(key);
      statusDiv.textContent = `Preset aplicado: ${key}`;
      errorMsg.textContent = '';
    }

    presetButtons.forEach(btn => {
      btn.addEventListener('click', () => applyPreset(btn.dataset.preset));
    });

    function updateLabels() {
      volOrigLabel.textContent = `${volOriginal.value}%`;
      volUpperLabel.textContent = `${volUpper.value}%`;
      volLowerLabel.textContent = `${volLower.value}%`;
      toneCutoffLabel.textContent = `${toneCutoff.value} Hz`;
      humanizeMsLabel.textContent = `${humanizeMs.value} ms`;
      chorusDepthLabel.textContent = `${chorusDepth.value}%`;
    }

    function updateModeUI() {
      const isDual = modeSelect.value === 'dual';
      singleIntervalGroup.style.display = isDual ? 'none' : 'flex';
      ratioDisplay.textContent = isDual
        ? 'Modo dual fijo: +3 st y -3 st'
        : `Modo simple: ratio ${parseFloat(intervalSelect.value).toFixed(4)}`;
    }

    modeSelect.onchange = updateModeUI;
    intervalSelect.onchange = updateModeUI;

    volOriginal.oninput = updateLabels;
    volUpper.oninput = updateLabels;
    volLower.oninput = updateLabels;
    toneCutoff.oninput = updateLabels;
    humanizeMs.oninput = updateLabels;
    chorusDepth.oninput = updateLabels;

    updateLabels();
    updateModeUI();
    applyPreset('suave'); // preset inicial recomendado

    // Utilidades de audio
    function stopAllSources() {
      activeSources.forEach(node => {
        try { node.stop(); } catch (_) {}
        node.onended = null;
      });
      activeSources = [];
    }

    function stopAll() {
      stopAllSources();
      if (mediaRecorder && mediaRecorder.state === 'recording') {
        mediaRecorder.stop();
        mediaRecorder.stream.getTracks().forEach(t => t.stop());
      }
      recordBtn.disabled = false;
      stopRecordBtn.disabled = true;
      playBtn.disabled = !originalBuffer;
      playHarmonyOnlyBtn.disabled = !originalBuffer;
      statusDiv.textContent = originalBuffer ? 'Detenido.' : 'Listo para grabar.';
    }

    function createLowpass(ctx, freqHz) {
      const lp = ctx.createBiquadFilter();
      lp.type = 'lowpass';
      lp.frequency.value = freqHz;
      lp.Q.value = 0.7;
      return lp;
    }

    function createHighpass(ctx, freqHz = 120) {
      const hp = ctx.createBiquadFilter();
      hp.type = 'highpass';
      hp.frequency.value = freqHz;
      hp.Q.value = 0.707;
      return hp;
    }

    function createChorusLFO(ctx, delayNode, depthMs = 6, rateHz = 0.35) {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.value = rateHz;
      gain.gain.value = depthMs / 1000; // ms -> segundos
      osc.connect(gain);
      gain.connect(delayNode.delayTime);
      osc.start();
      return { osc, gain };
    }

    function pitchShift(inputBuffer, ratio) {
      return new Promise((resolve, reject) => {
        try {
          const sampleRate = inputBuffer.sampleRate;
          const duration = inputBuffer.duration;
          const length = Math.ceil(sampleRate * duration);

          const offlineCtx = new OfflineAudioContext(2, length, sampleRate);
          const shifter = new PitchShifter(offlineCtx, inputBuffer, 4096);

          shifter.pitch = ratio;
          shifter.tempo = 1.0;
          shifter.rate = 1.0;
          shifter.connect(offlineCtx.destination);

          offlineCtx.startRendering().then(resolve).catch(reject);
        } catch (err) {
          reject(err);
        }
      });
    }

    async function buildHarmonyBuffers(mode) {
      if (mode === 'single') {
        const ratio = parseFloat(intervalSelect.value);
        const harmony = await pitchShift(originalBuffer, ratio);
        ratioDisplay.textContent = `Modo simple: ratio ${ratio.toFixed(4)}`;
        return [{ role: 'single', buffer: harmony }];
      }

      // Dual conservador para evitar "ardilla"
      const upperRatio = 1.1892; // +3 st
      const lowerRatio = 0.8409; // -3 st
      ratioDisplay.textContent = 'Modo dual fijo: +3 st y -3 st';

      const [upper, lower] = await Promise.all([
        pitchShift(originalBuffer, upperRatio),
        pitchShift(originalBuffer, lowerRatio)
      ]);

      return [
        { role: 'upper', buffer: upper },
        { role: 'lower', buffer: lower }
      ];
    }

    function connectAndStartSource({
      buffer,
      volume,
      cutoffHz,
      delayMs,
      chorusPercent,
      isOriginal,
      startAt
    }) {
      if (volume <= 0) return;

      const src = audioContext.createBufferSource();
      src.buffer = buffer;

      const hp = createHighpass(audioContext, isOriginal ? 80 : 120);
      const lp = createLowpass(audioContext, isOriginal ? 12000 : cutoffHz);
      const gain = audioContext.createGain();
      gain.gain.value = volume;

      let lfo = null;

      if (!isOriginal) {
        const delay = audioContext.createDelay(1);
        const baseDelaySec = Math.max(0, delayMs) / 1000;
        delay.delayTime.value = baseDelaySec;

        const depthMs = (chorusPercent / 100) * 8; // hasta 8ms de modulación
        lfo = createChorusLFO(audioContext, delay, depthMs, 0.33);

        src.connect(delay);
        delay.connect(hp);
      } else {
        src.connect(hp);
      }

      hp.connect(lp);
      lp.connect(gain);
      gain.connect(audioContext.destination);

      src.start(startAt);
      activeSources.push(src);

      src.onended = () => {
        const idx = activeSources.indexOf(src);
        if (idx >= 0) activeSources.splice(idx, 1);

        if (lfo) {
          try { lfo.osc.stop(); } catch (_) {}
        }
        if (activeSources.length === 0) {
          statusDiv.textContent = 'Reproducción finalizada.';
        }
      };
    }

    async function generateAndPlay(onlyHarmony = false) {
      if (!originalBuffer) return;

      errorMsg.textContent = '';
      stopAllSources();

      if (!audioContext) audioContext = new AudioContext();
      if (audioContext.state === 'suspended') await audioContext.resume();

      statusDiv.textContent = 'Generando armonías...';

      try {
        const mode = modeSelect.value;
        const harmonyList = await buildHarmonyBuffers(mode);

        const volOrig = Number(volOriginal.value) / 100;
        const volUp = Number(volUpper.value) / 100;
        const volLo = Number(volLower.value) / 100;

        const cutoffHz = Number(toneCutoff.value);
        const humanMs = Number(humanizeMs.value);
        const chorPct = Number(chorusDepth.value);

        const now = audioContext.currentTime + 0.03;

        // Original
        connectAndStartSource({
          buffer: originalBuffer,
          volume: onlyHarmony ? 0 : volOrig,
          cutoffHz,
          delayMs: 0,
          chorusPercent: 0,
          isOriginal: true,
          startAt: now
        });

        if (mode === 'single') {
          connectAndStartSource({
            buffer: harmonyList[0].buffer,
            volume: volUp,
            cutoffHz,
            delayMs: humanMs,
            chorusPercent: chorPct,
            isOriginal: false,
            startAt: now
          });
        } else {
          const upper = harmonyList.find(x => x.role === 'upper').buffer;
          const lower = harmonyList.find(x => x.role === 'lower').buffer;

          connectAndStartSource({
            buffer: upper,
            volume: volUp,
            cutoffHz,
            delayMs: humanMs,
            chorusPercent: chorPct,
            isOriginal: false,
            startAt: now
          });

          connectAndStartSource({
            buffer: lower,
            volume: volLo,
            cutoffHz: Math.max(2200, cutoffHz - 400),
            delayMs: humanMs + 8,
            chorusPercent: Math.max(0, chorPct - 5),
            isOriginal: false,
            startAt: now
          });
        }

        statusDiv.textContent = onlyHarmony ? 'Reproduciendo solo armonías...' : 'Reproduciendo mezcla...';
      } catch (e) {
        errorMsg.textContent = `Error en procesamiento: ${e.message}`;
        statusDiv.textContent = 'Error.';
      }
    }

    // Grabación
    recordBtn.onclick = async () => {
      errorMsg.textContent = '';
      try {
        stopAll();

        const stream = await navigator.mediaDevices.getUserMedia({
          audio: {
            echoCancellation: true,
            noiseSuppression: true,
            autoGainControl: true
          }
        });

        mediaRecorder = new MediaRecorder(stream);
        audioChunks = [];

        mediaRecorder.ondataavailable = e => audioChunks.push(e.data);

        mediaRecorder.onstop = async () => {
          try {
            const blob = new Blob(audioChunks, { type: 'audio/webm' });
            statusDiv.textContent = 'Procesando grabación...';
            const arrayBuf = await blob.arrayBuffer();

            if (!audioContext) audioContext = new AudioContext();
            originalBuffer = await audioContext.decodeAudioData(arrayBuf);

            playBtn.disabled = false;
            playHarmonyOnlyBtn.disabled = false;
            recordBtn.disabled = false;
            stopRecordBtn.disabled = true;
            statusDiv.textContent = 'Listo. Puedes reproducir.';
          } catch (err) {
            errorMsg.textContent = `Error decodificando audio: ${err.message}`;
            statusDiv.textContent = 'Error.';
          }
        };

        mediaRecorder.start();
        recordBtn.disabled = true;
        stopRecordBtn.disabled = false;
        playBtn.disabled = true;
        playHarmonyOnlyBtn.disabled = true;
        statusDiv.textContent = 'Grabando...';
      } catch (e) {
        errorMsg.textContent = `Error de micrófono: ${e.message}`;
        recordBtn.disabled = false;
      }
    };

    stopRecordBtn.onclick = () => {
      if (mediaRecorder && mediaRecorder.state === 'recording') {
        mediaRecorder.stop();
        mediaRecorder.stream.getTracks().forEach(t => t.stop());
        stopRecordBtn.disabled = true;
      }
    };

    playBtn.onclick = () => generateAndPlay(false);
    playHarmonyOnlyBtn.onclick = () => generateAndPlay(true);
    stopAllBtn.onclick = stopAll;

    // Activar contexto por interacción
    document.body.addEventListener('touchstart', () => {
      if (!audioContext) audioContext = new AudioContext();
    }, { once: true });

    document.body.addEventListener('click', () => {
      if (audioContext && audioContext.state === 'suspended') {
        audioContext.resume();
      }
    });
  </script>
</body>
</html>
