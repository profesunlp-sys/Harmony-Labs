<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Armonizador Vocal Mejorado</title>
    <style>
        body { font-family: sans-serif; text-align: center; padding: 15px; }
        button { font-size: 1.3em; padding: 12px 24px; margin: 8px; border-radius: 8px; }
        button:disabled { opacity: 0.5; }
        select, input[type=range] { font-size: 1.1em; padding: 6px; margin: 8px; }
        .control-group { margin: 12px 0; }
        label { display: inline-block; width: 130px; text-align: right; margin-right: 8px; }
        #status { font-size: 1.1em; margin: 12px; color: #2c3e50; }
        #ratioDisplay { font-size: 0.9em; color: #8e44ad; }
        #errorMsg { color: red; }
    </style>
</head>
<body>
    <h2>🎵 Armonizador Vocal (v2)</h2>

    <div class="control-group">
        <label for="modeSelect">Modo:</label>
        <select id="modeSelect">
            <option value="dual" selected>Doble armonía (más natural)</option>
            <option value="single">Armonía simple</option>
        </select>
    </div>

    <div class="control-group" id="singleIntervalGroup" style="display:none;">
        <label for="intervalSelect">Intervalo:</label>
        <select id="intervalSelect">
            <option value="1.2599">Tercera mayor (+4 st)</option>
            <option value="1.1892" selected>Tercera menor (+3 st)</option>
            <option value="1.4983">Quinta justa (+7 st)</option>
            <option value="1.6818">Sexta mayor (+9 st)</option>
            <option value="2.0000">Octava (+12 st)</option>
            <option value="1.3348">Cuarta justa (+5 st)</option>
            <option value="0.7937">Tercera mayor desc.</option>
            <option value="0.8409">Tercera menor desc.</option>
            <option value="0.6674">Quinta justa desc.</option>
        </select>
    </div>

    <div class="control-group">
        <label>Vol. Original:</label>
        <input type="range" id="volOriginal" min="0" max="200" value="100" step="1">
        <span id="volOrigLabel">100%</span>
    </div>
    <div class="control-group" id="dualVolGroup">
        <label>Vol. Armonía (+):</label>
        <input type="range" id="volUpper" min="0" max="150" value="60" step="1">
        <span id="volUpperLabel">60%</span>
    </div>
    <div class="control-group" id="dualVolGroup2">
        <label>Vol. Armonía (-):</label>
        <input type="range" id="volLower" min="0" max="150" value="60" step="1">
        <span id="volLowerLabel">60%</span>
    </div>

    <button id="recordBtn">🎤 Grabar</button>
    <button id="stopRecordBtn" disabled>⏹ Detener grabación</button>
    <button id="playBtn" disabled>🔊 Reproducir dúo</button>
    <button id="playHarmonyOnlyBtn" disabled>🎵 Solo armonías</button>
    <button id="stopAllBtn" style="background: #e74c3c; color: white;">⏹ STOP TODO</button>

    <div id="status">Listo para grabar</div>
    <div id="ratioDisplay"></div>
    <div id="errorMsg"></div>

    <!-- ==================== SOUNDTOUCH INCORPORADO (SIN EXPORT) ==================== -->

    <!-- ==================== LÓGICA DE LA APLICACIÓN (MEJORADA) ==================== -->
    <script>
        // UI elements
        const recordBtn = document.getElementById('recordBtn');
        const stopRecordBtn = document.getElementById('stopRecordBtn');
        const playBtn = document.getElementById('playBtn');
        const playHarmonyOnlyBtn = document.getElementById('playHarmonyOnlyBtn');
        const stopAllBtn = document.getElementById('stopAllBtn');
        const modeSelect = document.getElementById('modeSelect');
        const intervalSelect = document.getElementById('intervalSelect');
        const volOriginal = document.getElementById('volOriginal');
        const volUpper = document.getElementById('volUpper');
        const volLower = document.getElementById('volLower');
        const volOrigLabel = document.getElementById('volOrigLabel');
        const volUpperLabel = document.getElementById('volUpperLabel');
        const volLowerLabel = document.getElementById('volLowerLabel');
        const statusDiv = document.getElementById('status');
        const ratioDisplay = document.getElementById('ratioDisplay');
        const errorMsg = document.getElementById('errorMsg');

        // Volume label updates
        volOriginal.oninput = () => volOrigLabel.textContent = volOriginal.value + '%';
        volUpper.oninput = () => volUpperLabel.textContent = volUpper.value + '%';
        volLower.oninput = () => volLowerLabel.textContent = volLower.value + '%';

        // Show/hide interval selector based on mode
        const singleIntervalGroup = document.getElementById('singleIntervalGroup');
        const dualVolGroup = document.getElementById('dualVolGroup');
        const dualVolGroup2 = document.getElementById('dualVolGroup2');
        modeSelect.onchange = () => {
            const isDual = modeSelect.value === 'dual';
            singleIntervalGroup.style.display = isDual ? 'none' : 'block';
            dualVolGroup.style.display = isDual ? 'block' : 'none';
            dualVolGroup2.style.display = isDual ? 'block' : 'none';
            if (isDual) {
                volUpper.disabled = false;
                volLower.disabled = false;
            } else {
                volUpper.disabled = true;
                volLower.disabled = true;
            }
        };
        // Initialize
        modeSelect.onchange();

        // Audio state
        let mediaRecorder = null;
        let audioChunks = [];
        let audioContext = null;
        let originalBuffer = null;
        let activeSources = [];

        // Helper to create a low-pass filter for naturalness
        function createLowpassFilter(ctx, freq = 4000) {
            const filter = ctx.createBiquadFilter();
            filter.type = 'lowpass';
            filter.frequency.value = freq;
            filter.Q.value = 0.7;
            return filter;
        }

        // Delay node (small delay for chorusing)
        function createDelayNode(ctx, delayTime = 0.015) {
            const delay = ctx.createDelay(1);
            delay.delayTime.value = delayTime;
            return delay;
        }

        // ============================================================
        // pitchShift usando PitchShifter + OfflineAudioContext (corregido)
        // ============================================================
        function pitchShift(inputBuffer, ratio) {
            return new Promise((resolve, reject) => {
                const sampleRate = inputBuffer.sampleRate;
                const duration = inputBuffer.duration;
                // Offline context with 2 channels (stereo)
                const offlineCtx = new OfflineAudioContext(2, sampleRate * duration, sampleRate);

                const shifter = new PitchShifter(offlineCtx, inputBuffer, 4096);
                shifter.pitch = ratio;
                shifter.tempo = 1.0;
                shifter.rate = 1.0;
                shifter.connect(offlineCtx.destination);

                offlineCtx.startRendering().then((renderedBuffer) => {
                    resolve(renderedBuffer);
                }).catch((err) => {
                    reject(err);
                });
            });
        }

        // ============================================================
        // Obtener ratio (para modo simple)
        // ============================================================
        function getRatio() {
            const r = parseFloat(intervalSelect.value);
            ratioDisplay.textContent = `Ratio: ${r.toFixed(4)}`;
            return r;
        }

        // ============================================================
        // Limpiar fuentes activas
        // ============================================================
        function stopAllSources() {
            activeSources.forEach(s => {
                try { s.stop(); } catch(e) {}
                if (s.onended) s.onended = null;
            });
            activeSources = [];
        }

        function stopAll() {
            stopAllSources();
            if (mediaRecorder && mediaRecorder.state === 'recording') {
                mediaRecorder.stop();
                mediaRecorder.stream.getTracks().forEach(t => t.stop());
            }
            recordBtn.disabled = false;
            stopRecordBtn.disabled = true;
            playBtn.disabled = !originalBuffer;
            playHarmonyOnlyBtn.disabled = !originalBuffer;
            statusDiv.textContent = originalBuffer ? 'Detenido.' : 'Listo para grabar.';
        }

        // ============================================================
        // Grabación
        // ============================================================
        recordBtn.onclick = async () => {
            errorMsg.textContent = '';
            try {
                stopAll();
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                mediaRecorder = new MediaRecorder(stream);
                audioChunks = [];
                mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
                mediaRecorder.onstop = async () => {
                    const blob = new Blob(audioChunks, { type: 'audio/webm' });
                    statusDiv.textContent = 'Procesando grabación...';
                    const arrayBuf = await blob.arrayBuffer();
                    if (!audioContext) audioContext = new AudioContext();
                    originalBuffer = await audioContext.decodeAudioData(arrayBuf);
                    playBtn.disabled = false;
                    playHarmonyOnlyBtn.disabled = false;
                    stopRecordBtn.disabled = true;
                    recordBtn.disabled = false;
                    statusDiv.textContent = 'Listo. Elegí modo y reproducí.';
                };
                mediaRecorder.start();
                statusDiv.textContent = 'Grabando...';
                recordBtn.disabled = true;
                stopRecordBtn.disabled = false;
                playBtn.disabled = true;
                playHarmonyOnlyBtn.disabled = true;
            } catch (e) {
                errorMsg.textContent = 'Error al acceder al micrófono: ' + e.message;
                recordBtn.disabled = false;
            }
        };

        stopRecordBtn.onclick = () => {
            if (mediaRecorder && mediaRecorder.state === 'recording') {
                mediaRecorder.stop();
                mediaRecorder.stream.getTracks().forEach(t => t.stop());
                stopRecordBtn.disabled = true;
            }
        };

        // ============================================================
        // Reproducción del dúo o solo armonías
        // ============================================================
        async function generateAndPlay(onlyHarmony = false) {
            if (!originalBuffer) return;
            stopAllSources();
            if (!audioContext) audioContext = new AudioContext();

            const mode = modeSelect.value;
            statusDiv.textContent = 'Generando armonías...';

            try {
                let buffersToPlay = []; // array of { buffer, volume, delay }

                if (mode === 'single') {
                    // Modo simple: una sola armonía
                    const ratio = getRatio();
                    const harmonyBuffer = await pitchShift(originalBuffer, ratio);
                    buffersToPlay.push({
                        buffer: originalBuffer,
                        volume: onlyHarmony ? 0 : volOriginal.value / 100,
                        delay: 0
                    });
                    buffersToPlay.push({
                        buffer: harmonyBuffer,
                        volume: onlyHarmony ? volUpper.value / 100 : volUpper.value / 100,
                        delay: 0.015 // pequeño retraso para sensación de coro
                    });
                } else {
                    // Modo doble: armonía superior e inferior
                    const upperRatio = 1.1892; // tercera menor (+3 st)
                    const lowerRatio = 0.8409; // tercera menor descendente (-3 st)

                    const [upperBuffer, lowerBuffer] = await Promise.all([
                        pitchShift(originalBuffer, upperRatio),
                        pitchShift(originalBuffer, lowerRatio)
                    ]);

                    buffersToPlay.push({
                        buffer: originalBuffer,
                        volume: onlyHarmony ? 0 : volOriginal.value / 100,
                        delay: 0
                    });
                    buffersToPlay.push({
                        buffer: upperBuffer,
                        volume: onlyHarmony ? volUpper.value / 100 : volUpper.value / 100,
                        delay: 0.015
                    });
                    buffersToPlay.push({
                        buffer: lowerBuffer,
                        volume: onlyHarmony ? volLower.value / 100 : volLower.value / 100,
                        delay: 0.030 // un poco más de retraso
                    });
                }

                // Crear nodos y conectar con filtros y delays
                buffersToPlay.forEach((item) => {
                    if (item.volume <= 0) return;

                    const src = audioContext.createBufferSource();
                    src.buffer = item.buffer;

                    // Cadena: source -> delay (si >0) -> lowpass -> gain -> destination
                    const delayNode = item.delay > 0 ? createDelayNode(audioContext, item.delay) : null;
                    const lowpass = createLowpassFilter(audioContext, 3500); // suaviza los agudos metálicos
                    const gainNode = audioContext.createGain();
                    gainNode.gain.value = item.volume;

                    if (delayNode) {
                        src.connect(delayNode);
                        delayNode.connect(lowpass);
                    } else {
                        src.connect(lowpass);
                    }
                    lowpass.connect(gainNode);
                    gainNode.connect(audioContext.destination);

                    // Programar inicio
                    const startTime = audioContext.currentTime + (item.delay > 0 ? 0.005 : 0);
                    src.start(startTime);

                    // Almacenar referencia
                    activeSources.push(src);

                    // Cuando termine, remover del array
                    src.onended = () => {
                        const idx = activeSources.indexOf(src);
                        if (idx > -1) activeSources.splice(idx, 1);
                        if (activeSources.length === 0) {
                            statusDiv.textContent = 'Reproducción finalizada.';
                        }
                    };
                });

                statusDiv.textContent = onlyHarmony ? 'Reproduciendo solo armonías...' : 'Reproduciendo dúo...';
                ratioDisplay.textContent = mode === 'single' ? getRatio().toFixed(4) : 'Doble (3ª sup + 3ª inf)';
            } catch (e) {
                errorMsg.textContent = 'Error en el procesamiento: ' + e.message;
                statusDiv.textContent = 'Error.';
            }
        }

        playBtn.onclick = () => generateAndPlay(false);
        playHarmonyOnlyBtn.onclick = () => generateAndPlay(true);
        stopAllBtn.onclick = stopAll;

        // Activar contexto de audio en primer toque
        document.body.addEventListener('touchstart', () => {
            if (!audioContext) audioContext = new AudioContext();
        }, { once: true });
    </script>
</body>
